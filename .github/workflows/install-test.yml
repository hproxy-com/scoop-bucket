# Written by package-managers.mjs: install hproxy from this bucket the way a stranger does, on x64 and ARM.
name: Install test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoop:
    name: scoop install on ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: 64bit }
          - { os: windows-11-arm, arch: arm64 }
          - { os: windows-latest, arch: 32bit }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Scoop
        run: |
          irm get.scoop.sh -OutFile install-scoop.ps1
          ./install-scoop.ps1 -RunAsAdmin
          "$env:USERPROFILE\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install from this bucket
        run: |
          scoop bucket add hproxy https://github.com/hproxy-com/scoop-bucket
          scoop install hproxy/hproxy --arch ${{ matrix.arch }}
      - name: It answers with this version
        run: |
          $said = hproxy --version
          $said
          if ($said -notmatch [regex]::Escape("hproxy 0.4.9")) { throw "it says $said, not hproxy 0.4.9" }
